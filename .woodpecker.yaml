when:
  # A pull_request filters `branch` on its BASE, so PRs are left unfiltered
  # to cover every base branch, as the GitHub workflow did.
  - event: pull_request
  - event: push
    branch: main

steps:
  - name: build
    image: debian:bookworm-slim
    commands:
      - apt-get update -qq && apt-get install -yqq --no-install-recommends curl ca-certificates > /dev/null
      # Pinned to the compiler that reproducibly builds the DEPLOYED guard
      # bytes (spend hash ecb3ce03…). Bumping this must re-verify that hash.
      # Same release asset setup-aiken fetched, checked against the release digest.
      - curl -fsSL -o /tmp/aiken.tar.gz https://github.com/aiken-lang/aiken/releases/download/v1.1.23/aiken-x86_64-unknown-linux-musl.tar.gz
      - echo "b98c4ccbada5e35f15ba417a52872aeaf0c65998aed77351769ce5fd2506b570  /tmp/aiken.tar.gz" | sha256sum -c -
      - tar xzf /tmp/aiken.tar.gz -C /usr/local/bin --strip-components=1 aiken-x86_64-unknown-linux-musl/aiken
      - aiken --version
      - aiken fmt --check
      - aiken check -D
      - aiken build
