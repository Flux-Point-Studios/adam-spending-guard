name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: aiken-lang/setup-aiken@v1
        with:
          # Pinned to the compiler that reproducibly builds the DEPLOYED guard
          # bytes (spend hash ecb3ce03…). Bumping this must re-verify that hash.
          version: v1.1.23
      - run: aiken fmt --check
      - run: aiken check -D
      - run: aiken build
